[package]
name = "taurimule"
version = "0.1.7"
description = "TauriMule — Modern ED2K/Kad desktop client"
authors = ["TauriMule Contributors"]
license = "GPL-2.0"
edition = "2021"
rust-version = "1.77.2"

[lib]
name = "taurimule_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
# Tauri core + plugins
tauri = { version = "2", features = ["tray-icon", "image-ico", "image-png"] }
tauri-plugin-shell = "2"
tauri-plugin-single-instance = "2"

# Serialization
serde = { version = "1", features = ["derive"] }
serde_json = "1"

# Async runtime
tokio = { version = "1", features = ["full"] }

# EC protocol
byteorder = "1"        # Binary encoding (big-endian integers)
md5 = "0.7"             # Authentication hash computation
flate2 = "1"            # ZLIB compression/decompression

# Logging
log = "0.4"
env_logger = "0.11"

# Error handling
thiserror = "2"
open = "5.4.4"
